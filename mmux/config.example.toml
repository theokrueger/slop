# mmux configuration
#
# Default location: ~/.config/mmux.toml
# Every setting below shows its built-in default.

[server]
# Keep this on loopback. Put a TLS reverse proxy (or an SSH tunnel) in front
# of mmux for remote access, since credentials are sent to this endpoint.
bind = "127.0.0.1:8787"
# Mark the session cookie `Secure`. Set to true when serving over HTTPS.
secure_cookies = false

[auth]
# Linux-PAM service used to verify the password of the user mmux runs as.
# Create /etc/pam.d/mmux if you want a dedicated policy; otherwise the
# standard `login` stack works. The mmux process must be allowed to invoke
# pam_unix (it uses the setuid unix_chkpwd helper when running unprivileged).
pam_service = "login"
# Sessions expire after this many hours of inactivity.
session_hours = 24

[workspace]
# The interactive directory picker cannot navigate outside this directory.
# `~` expands to the home directory. Use "/" for unrestricted browsing.
root = "~"

[terminal]
# Initial pane size, until a browser viewport negotiates its own size.
rows = 30
cols = 100
# Fixed Solarized appearance for the UI and terminals: "dark" or "light".
# This is reported to programs at startup so TUI backgrounds render correctly.
appearance = "dark"

# Every new project starts this set of panes, in the directory chosen in the
# browser. Projects are created on demand and persisted in per-project
# directories under $XDG_STATE_HOME/mmux/projects/; on restart they are
# restored with fresh panes in their saved working directories.
#
# `{session_id}` is replaced once per pane with a UUID when the project is
# created, and the resolved command is saved with the project. The default pi
# panes therefore resume their session after a restart. Commands without the
# placeholder are left untouched.
# Commands are restarted after they exit. An empty `command` starts the user's
# $SHELL. Four slots are available:
# top-left, top-right, bottom-left, bottom-right. Omitted slots stay empty.

[[new_project.panes]]
slot = "top-left"
command = ["pi", "--session-id", "{session_id}"]

[[new_project.panes]]
slot = "bottom-left"
command = ["pi", "--session-id", "{session_id}"]

[[new_project.panes]]
slot = "top-right"
command = ["emacs", "-nw"]

[[new_project.panes]]
slot = "bottom-right"
command = []
