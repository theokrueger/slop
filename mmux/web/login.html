<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#002b36">
  <title>sign in · mmux</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="login-body">
  <main class="login">
    <h1 class="brand">mmux</h1>
    <p class="login-hint">Sign in with the Linux account that runs mmux.</p>

    <form id="login-form" class="login-form">
      <label class="field">
        <span>Username</span>
        <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>

      <p id="login-error" class="error" hidden></p>

      <button id="login-submit" class="button primary" type="submit">Sign in</button>
    </form>
  </main>

  <script src="assets/login.js"></script>
</body>
</html>
