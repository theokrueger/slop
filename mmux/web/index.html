<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>mmux</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/vendor/xterm.css">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div id="loading" class="loading">loading mmux…</div>

  <div id="app" class="app" hidden>
    <aside class="sidebar">
      <div class="brand">mmux</div>

      <nav id="tabs" class="tabs" aria-label="Tabs"></nav>

      <button id="new-tab" class="new-tab" type="button">+ new tab</button>

      <div class="sidebar-footer">
        <span id="user" class="user"></span>
        <button id="logout" class="link-button" type="button">log out</button>
      </div>
    </aside>

    <main id="main" class="main">
      <div id="panes" class="panes"></div>
      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title">No tabs open</p>
        <p class="empty-hint">Start a workspace in the directory you want to work in.</p>
        <button id="empty-new-tab" type="button">New tab</button>
      </div>
    </main>
  </div>

  <dialog id="new-tab-dialog" class="dialog">
    <form id="new-tab-form" method="dialog">
      <h2>New tab</h2>

      <label class="field">
        <span>Name</span>
        <input id="new-tab-name" type="text" maxlength="80" autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span>Working directory</span>
        <input id="dir-path" type="text" autocomplete="off" spellcheck="false">
      </label>

      <div id="dir-current" class="dir-current"></div>
      <ul id="dir-list" class="dir-list" aria-label="Directories"></ul>

      <p id="dialog-error" class="error" hidden></p>

      <div class="dialog-actions">
        <button id="dialog-cancel" class="button" type="button">Cancel</button>
        <button id="dialog-create" class="button primary" type="submit">Create tab</button>
      </div>
    </form>
  </dialog>

  <script src="assets/vendor/xterm.js"></script>
  <script src="assets/vendor/addon-fit.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
