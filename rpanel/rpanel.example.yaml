# rpanel example configuration.
# Copy to ~/.config/rpanel.yaml (or pass --config).

server:
  # Append logs here. Omit to log to stdout.
  log: "/var/log/rpanel.log"
  host: 127.0.0.1
  port: 80
  # Serve plain HTTP. When false, cert and key are required.
  allow_insecure: false
  # Accept invalid upstream TLS certificates (self-signed, wrong hostname).
  allow_insecure_upstream: false
  cert: "/etc/rpanel/cert.pem"
  key: "/etc/rpanel/key.pem"

panel:
  enable: true
  # Reload the page every N seconds. 0 disables automatic refresh.
  refresh_seconds: 10
  status:
    storage: true
    ram: true
    uptime: true
    network: true
    # Plain strings are system units. Use { name, user: true } for user units.
    status:
      - tary
      - name_api_thing
      # - name: my-user-service
      #   user: true
  links:
    Tary: "/tary/"
    Name: "/name/"
  # Where the network history is persisted. Defaults to the platform state
  # directory (~/.local/state/rpanel/network.yaml).
  # network_state: "/home/me/.local/state/rpanel/network.yaml"

groups:
  "Name":
    host: "127.0.0.1:8080"
    https: false
    # Rewrite root-absolute URLs (href="/x", url(/x), "/x" in JS) to this
    # group's prefix, for upstreams that do not support a base path.
    # rewrite: true
    # Forward Origin/Referer unchanged for apps that validate them against
    # X-Forwarded-Host (reverse-proxy aware, e.g. qBittorrent).
    # preserve_origin: true
    paths:
      "/name": "/"
      "/name/*": "/*"
  "Tary":
    host: "cow.local:3001"
    https: false
    # Send X-Forwarded-Prefix for apps served under a path prefix.
    forwarded_prefix: true
    paths:
      "/tary": "/"
      "/tary/*": "/*"
  "API":
    host: "127.0.0.1:8081"
    https: false
    paths:
      "/api/*": "/v1/*"
