[package]
name = "rpanel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A small reverse proxy with a server-rendered status panel"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.9", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["http1"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "http2", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "network", "system"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
strip = true
